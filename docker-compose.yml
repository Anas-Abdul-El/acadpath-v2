services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-acadpath}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-acadpath}
      POSTGRES_DB: ${POSTGRES_DB:-acadpath}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    image: acadpath-backend:latest
    restart: unless-stopped
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-acadpath}:${POSTGRES_PASSWORD:-acadpath}@postgres:5432/${POSTGRES_DB:-acadpath}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-acadpath}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-acadpath}
      DB_NAME: ${POSTGRES_DB:-acadpath}
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Browser-facing URL of the API (baked in at build time)
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    image: acadpath-frontend:latest
    restart: unless-stopped
    environment:
      # Server-side (RSC / route handlers) calls go over the compose network
      API_URL: http://backend:4000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  postgres-data:
